name: Godot plugin test
description: Runs the Godot addon's headless test on the official Godot build, checked against its SHA-512.
runs:
  using: composite
  steps:
    - name: Download Godot
      id: godot
      shell: pwsh
      env:
        GODOT_VERSION: 4.7.2
        # Godot_v4.7.2-stable_win64.exe.zip in the release's SHA512-SUMS.txt
        GODOT_SHA512: 83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993
      run: |
        $name = "Godot_v$env:GODOT_VERSION-stable_win64"
        $url = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable/$name.exe.zip"
        $folder = Join-Path $env:RUNNER_TEMP 'godot'
        New-Item -ItemType Directory -Path $folder | Out-Null
        $zip = Join-Path $folder "$name.exe.zip"
        Invoke-WebRequest -Uri $url -OutFile $zip
        $hash = (Get-FileHash -Algorithm SHA512 -LiteralPath $zip).Hash.ToLowerInvariant()
        if ($hash -cne $env:GODOT_SHA512) {
          throw "$url has SHA-512 $hash, not $env:GODOT_SHA512"
        }
        Expand-Archive -LiteralPath $zip -DestinationPath $folder
        $exe = Join-Path $folder "${name}_console.exe"
        if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
          throw "$name.exe.zip has no ${name}_console.exe"
        }
        "path=$exe" >> $env:GITHUB_OUTPUT
    - name: Run the Godot plugin test
      shell: pwsh
      env:
        GODOT: ${{ steps.godot.outputs.path }}
      run: |
        & (Join-Path $env:GITHUB_WORKSPACE 'eng/test-plugins.ps1') -Engine Godot -Godot $env:GODOT -TimeoutMinutes 5 `
          -WorkDirectory (Join-Path $env:RUNNER_TEMP 'plugin-tests')
