name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Check the tag against the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [xml] $props = Get-Content -Raw Directory.Build.props
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($env:TAG -cne "v$version") {
            throw "The tag $env:TAG is not v$version, the version in Directory.Build.props"
          }
      - name: Check that the tag is on main
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The tag must point at a commit on main: $(git rev-parse HEAD) is not on origin/main"
          }
      - name: Cut the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: ./eng/release-notes.ps1 -Version $env:TAG.Substring(1) -OutputPath "$env:RUNNER_TEMP/notes.md"
      - run: dotnet build Cluewren.slnx -c Release
      - run: dotnet test tests/Cluewren.Tests -c Release --no-build
      - run: ./eng/package.ps1 -OutputDirectory "$env:RUNNER_TEMP/assets"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*
      - name: Create the draft release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "A release for $env:TAG exists already: delete it before running this again"
          }
          $assets = (Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/assets" -File).FullName
          gh release create $env:TAG --draft --verify-tag --title "Cluewren $env:TAG" --notes-file "$env:RUNNER_TEMP/notes.md" @assets
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed"
          }
